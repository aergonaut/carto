[package]
name = "carto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
delaunator = "1.1.0"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "tiff", "bmp", "webp"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
